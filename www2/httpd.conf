# BusyBox httpd's built-in MIME suffix table has no font entries at all, so
# without these the server sends /graphics/Nunito.woff* with NO Content-Type
# header (httpd.c only emits Content-Type when a suffix match is found).
# That leaves the browser to sniff the font instead of trusting a real
# header — usually fine, but flaky under load, which reads as "font doesn't
# load until you reload the page."
.woff:font/woff
.woff2:font/woff2
